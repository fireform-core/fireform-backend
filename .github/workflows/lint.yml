name: Lint

on:
  push:
    branches: [main, development]  # post-merge verification after PRs land
  pull_request:
    branches: [main, development, 'development-*']  # gates all PRs

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install linter
        run: |
          python -m pip install --upgrade pip
          pip install ruff==0.16.1

      - name: Run linter
        run: |
          ruff check app/ --output-format=github